spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration/{vendor}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://issuer.example.test
          audiences: test-api
  rabbitmq:
    username: test-user
    virtual-host: /pedidos360
    password: test-password
    listener:
      simple:
        auto-startup: false
app:
  scheduling:
    enabled: false
  outbox:
    enabled: false
  services:
    orders-url: http://localhost:18081
    catalog-url: http://localhost:18082
    notify-url: http://localhost:18083
    rabbit-admin-url: http://localhost:18084
  catalog-url: http://localhost:18082
  artifacts: ./target/test-artifacts
  demo-failure-enabled: true
  rabbit-management-url: http://localhost:18072
INTERNAL_SERVICE_KEY: test-service-key-0123456789abcdef0123456789
