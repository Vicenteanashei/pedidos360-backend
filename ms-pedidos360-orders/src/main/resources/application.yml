server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: ms-pedidos360-orders
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  cors:
    # Separar varios origenes con coma (5173 = Vite/React)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

---
# Desarrollo local: H2 en memoria (no necesita nada instalado)
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:ordersdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    show-sql: true

---
# Oracle: contenedor del compose (FREEPDB1) o la base cloud
spring:
  config:
    activate:
      on-profile: oracle
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${DB_USERNAME:pedidos360}
    password: ${DB_PASSWORD:pedidos360}
