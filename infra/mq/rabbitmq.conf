cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbit1
# rabbit1 is the discovery seed; joining nodes contact it after its health check.
# Three nodes join the seed. It need not resolve joining nodes before boot.
cluster_partition_handling = pause_minority
vm_memory_high_watermark.relative = 0.5
disk_free_limit.absolute = 256MB
management.tcp.port = 15672
