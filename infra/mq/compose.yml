services:
  rabbit1:
    image: rabbitmq:4.2-management
    hostname: rabbit1
    environment:
      RABBITMQ_NODENAME: rabbit@rabbit1
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_COOKIE:?Generate .env first}
      RABBITMQ_DEFAULT_USER: ${RABBIT_ADMIN_USER:-mqadmin}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_ADMIN_PASSWORD:?Generate .env first}
      RABBITMQ_DEFAULT_VHOST: /pedidos360
    volumes:
      - rabbit1_data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, check_running]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    ports:
      - "${MQ_BIND_ADDRESS:-127.0.0.1}:5672:5672"
      - "${MQ_MANAGEMENT_BIND_ADDRESS:-127.0.0.1}:15672:15672"
  rabbit2:
    image: rabbitmq:4.2-management
    hostname: rabbit2
    environment:
      RABBITMQ_NODENAME: rabbit@rabbit2
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_COOKIE:?Generate .env first}
      RABBITMQ_DEFAULT_USER: ${RABBIT_ADMIN_USER:-mqadmin}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_ADMIN_PASSWORD:?Generate .env first}
      RABBITMQ_DEFAULT_VHOST: /pedidos360
    volumes:
      - rabbit2_data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, check_running]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    ports:
      - "${MQ_BIND_ADDRESS:-127.0.0.1}:5673:5672"
    depends_on:
      rabbit1:
        # Peers must start together when recovering an existing cluster.
        condition: service_started
  rabbit3:
    image: rabbitmq:4.2-management
    hostname: rabbit3
    environment:
      RABBITMQ_NODENAME: rabbit@rabbit3
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_COOKIE:?Generate .env first}
      RABBITMQ_DEFAULT_USER: ${RABBIT_ADMIN_USER:-mqadmin}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_ADMIN_PASSWORD:?Generate .env first}
      RABBITMQ_DEFAULT_VHOST: /pedidos360
    volumes:
      - rabbit3_data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, check_running]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    ports:
      - "${MQ_BIND_ADDRESS:-127.0.0.1}:5674:5672"
    depends_on:
      rabbit1:
        # Peers must start together when recovering an existing cluster.
        condition: service_started
  mq-init:
    image: rabbitmq:4.2-management
    hostname: mq-init
    environment:
      RABBITMQ_NODENAME: rabbit@mq-init
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_COOKIE:?Generate .env first}
      RABBITMQ_USER: ${RABBITMQ_USER:-pedidos360}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Generate .env first}
    volumes:
      - ./init-app-user.sh:/init-app-user.sh:ro
      - ./policies.json:/policies.json:ro
    command: [bash, /init-app-user.sh]
    depends_on:
      rabbit1:
        condition: service_healthy
      rabbit2:
        condition: service_healthy
      rabbit3:
        condition: service_healthy
    restart: "no"
volumes:
  rabbit1_data:
  rabbit2_data:
  rabbit3_data:
