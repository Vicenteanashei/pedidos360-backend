services:
  zookeeper1:
    image: confluentinc/cp-zookeeper:7.9.2
    hostname: zookeeper1
    mem_limit: 384m
    environment:
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 10
      ZOOKEEPER_SYNC_LIMIT: 5
      ZOOKEEPER_SERVERS: zookeeper1:2888:3888;zookeeper2:2888:3888;zookeeper3:2888:3888
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
    volumes:
      - zk1_data:/var/lib/zookeeper/data
      - zk1_log:/var/lib/zookeeper/log
    healthcheck:
      test: [CMD, cub, zk-ready, "localhost:2181", "5"]
      interval: 10s
      timeout: 8s
      retries: 20
    restart: unless-stopped
  zookeeper2:
    image: confluentinc/cp-zookeeper:7.9.2
    hostname: zookeeper2
    mem_limit: 384m
    environment:
      ZOOKEEPER_SERVER_ID: 2
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 10
      ZOOKEEPER_SYNC_LIMIT: 5
      ZOOKEEPER_SERVERS: zookeeper1:2888:3888;zookeeper2:2888:3888;zookeeper3:2888:3888
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
    volumes:
      - zk2_data:/var/lib/zookeeper/data
      - zk2_log:/var/lib/zookeeper/log
    healthcheck:
      test: [CMD, cub, zk-ready, "localhost:2181", "5"]
      interval: 10s
      timeout: 8s
      retries: 20
    restart: unless-stopped
  zookeeper3:
    image: confluentinc/cp-zookeeper:7.9.2
    hostname: zookeeper3
    mem_limit: 384m
    environment:
      ZOOKEEPER_SERVER_ID: 3
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 10
      ZOOKEEPER_SYNC_LIMIT: 5
      ZOOKEEPER_SERVERS: zookeeper1:2888:3888;zookeeper2:2888:3888;zookeeper3:2888:3888
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
    volumes:
      - zk3_data:/var/lib/zookeeper/data
      - zk3_log:/var/lib/zookeeper/log
    healthcheck:
      test: [CMD, cub, zk-ready, "localhost:2181", "5"]
      interval: 10s
      timeout: 8s
      retries: 20
    restart: unless-stopped
  kafka1:
    image: confluentinc/cp-kafka:7.9.2
    hostname: kafka1
    mem_limit: 896m
    depends_on:
      zookeeper1: {condition: service_healthy}
      zookeeper2: {condition: service_healthy}
      zookeeper3: {condition: service_healthy}
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper1:2181,zookeeper2:2181,zookeeper3:2181
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:19092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-127.0.0.1}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "${KAFKA_BIND_ADDRESS:-127.0.0.1}:9092:9092"
    volumes:
      - kafka1_data:/var/lib/kafka/data
    healthcheck:
      test: [CMD, kafka-broker-api-versions, --bootstrap-server, "localhost:19092"]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 30s
    restart: unless-stopped
  kafka2:
    image: confluentinc/cp-kafka:7.9.2
    hostname: kafka2
    mem_limit: 896m
    depends_on:
      zookeeper1: {condition: service_healthy}
      zookeeper2: {condition: service_healthy}
      zookeeper3: {condition: service_healthy}
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper1:2181,zookeeper2:2181,zookeeper3:2181
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:19092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-127.0.0.1}:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "${KAFKA_BIND_ADDRESS:-127.0.0.1}:9093:9093"
    volumes:
      - kafka2_data:/var/lib/kafka/data
    healthcheck:
      test: [CMD, kafka-broker-api-versions, --bootstrap-server, "localhost:19092"]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 30s
    restart: unless-stopped
  kafka3:
    image: confluentinc/cp-kafka:7.9.2
    hostname: kafka3
    mem_limit: 896m
    depends_on:
      zookeeper1: {condition: service_healthy}
      zookeeper2: {condition: service_healthy}
      zookeeper3: {condition: service_healthy}
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper1:2181,zookeeper2:2181,zookeeper3:2181
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:19092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-127.0.0.1}:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "${KAFKA_BIND_ADDRESS:-127.0.0.1}:9094:9094"
    volumes:
      - kafka3_data:/var/lib/kafka/data
    healthcheck:
      test: [CMD, kafka-broker-api-versions, --bootstrap-server, "localhost:19092"]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 30s
    restart: unless-stopped
  kafka-init:
    image: confluentinc/cp-kafka:7.9.2
    depends_on:
      kafka1: {condition: service_healthy}
      kafka2: {condition: service_healthy}
      kafka3: {condition: service_healthy}
    volumes:
      - ./init-topics.sh:/init-topics.sh:ro
    command: [bash, /init-topics.sh]
    restart: "no"
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    mem_limit: 512m
    depends_on:
      kafka-init: {condition: service_completed_successfully}
    environment:
      KAFKA_CLUSTERS_0_NAME: pedidos360
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:19092,kafka2:19092,kafka3:19092
      AUTH_TYPE: LOGIN_FORM
      SPRING_SECURITY_USER_NAME: ${KAFKA_UI_USER:-kafkaadmin}
      SPRING_SECURITY_USER_PASSWORD: ${KAFKA_UI_PASSWORD:?Configure Kafka UI password}
    ports:
      - "${KAFKA_UI_BIND_ADDRESS:-127.0.0.1}:${KAFKA_UI_PORT:-8088}:8080"
    restart: unless-stopped
volumes:
  zk1_data:
  zk1_log:
  kafka1_data:
  zk2_data:
  zk2_log:
  kafka2_data:
  zk3_data:
  zk3_log:
  kafka3_data:

